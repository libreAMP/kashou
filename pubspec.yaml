name: kashou
description: Music player with local library playback and YouTube streaming
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.10
  audio_service: ^0.18.12
  audio_session: ^0.2.2
  
  path_provider: ^2.1.1
  permission_handler: ^12.0.1
  file_picker: ^10.3.3
  
  sqflite: ^2.3.0
  
  audiotags: ^1.4.2
  # on_audio_query: ^3.0.0-beta.0
  
  provider: ^6.1.1
  get_it: ^8.2.0
  
  google_fonts: ^6.1.0
  dynamic_color: ^1.7.0
  flutter_colorpicker: ^1.0.3
  cached_network_image: ^3.3.0
  
  rxdart: ^0.28.0
  shared_preferences: ^2.2.2
  package_info_plus: ^9.0.0
  image: ^4.0.17
  ytmusicapi_dart: ^2.1.1
  youtube_explode_dart: ^2.5.2

  cast: ^2.1.0
  
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#fcf5fb"
  adaptive_icon_foreground: "assets/icons/icon.png"

flutter_native_splash:
  color: "#fcf5fb"
  image: assets/images/splash.png
  android: true
  ios: false
  android_12:
    image: assets/images/splash.png
    color: "#fcf5fb"