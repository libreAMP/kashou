name: Flutter iOS Release Build

on:
  push:
    branches:
      - feature-equalizer
  workflow_dispatch:

jobs:
  build-ios:
    # cast sdk needs xcode 26
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Configure Flutter
        run: flutter config --no-enable-swift-package-manager

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q Kashou.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kashou-iOS
          path: Kashou.ipa
