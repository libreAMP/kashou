name: Flutter Windows Build

on:
  push:
    branches:
      - feature-equalizer
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install NuGet
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://dist.nuget.org/win-x86-commandline/latest/nuget.exe' -OutFile "$env:GITHUB_WORKSPACE\nuget.exe"
          Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE"

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Enable Developer Mode
        shell: pwsh
        run: |
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -PropertyType DWORD -Value 1 -Force

      - name: Get dependencies
        run: flutter pub get

      - name: Unpack audiotags
        shell: pwsh
        run: |
          $root = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { "$env:LOCALAPPDATA\Pub\Cache" }
          Get-ChildItem "$root\hosted\pub.dev" -Directory -Filter 'audiotags-*' | ForEach-Object {
            $dir = Join-Path $_.FullName 'windows'
            $ver = $_.Name.Substring('audiotags-'.Length)
            if (-not (Test-Path "$dir\windows.tar.gz")) {
              Invoke-WebRequest "https://github.com/erikas-taroza/audiotags/releases/download/v$ver/windows.tar.gz" -OutFile "$dir\windows.tar.gz"
            }
            if (-not (Test-Path "$dir\audiotags.dll")) {
              tar -xzf "$dir\windows.tar.gz" -C $dir
            }
          }

      - name: Build Windows executable
        run: flutter build windows --release

      - name: Archive Windows bundle
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "kashou-windows-x64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: kashou-windows-x64
          path: kashou-windows-x64.zip
